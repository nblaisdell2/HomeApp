services:
  postgres:
    image: postgres:17
    container_name: homeapp-postgres
    environment:
      POSTGRES_USER: home
      POSTGRES_PASSWORD: home
      POSTGRES_DB: home
    ports:
      - "5433:5432"
    volumes:
      - homeapp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home -d home"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  homeapp-pgdata:
